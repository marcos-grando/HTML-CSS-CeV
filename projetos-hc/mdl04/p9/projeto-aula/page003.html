<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto-Aula</title>
    <link rel="stylesheet" href="estilos/style_pa.css">

    <!-- Link para adicionar ícones, no caso foi usado apenas o de Menu para testar o que foi passado  na aula seguinte do conteúdo contido aqui -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,100,1,200" rel="stylesheet" />

</head>
<body>
    <header>
        <div class="title">
            <h1>Testando Media Queries</h1>
        </div>
        <div class="click">
            <a href="../index.html">Início</a> | <a href="../page002.html">Mobile First/Device Breakpoints</a> | <em>Testando</em>
        </div>

        <!-- Menu adicionado somente para testar o que foi passado na aula -->
        <span id="burguer" class="material-symbols-outlined ico-menu" onclick="clickMenu()">menu</span>
        <menu id="itens">
            <ul>
                <li><a href="../index.html">Início</a></li>
                <li><a href="../page002.html">Mobile First/Device Breakpoints</a></li>
                <li><em>Testando</em></li>
            </ul>
        </menu>
    </header>
    <main>
        <section class="primeiro">
            <div class="imgs">
                <img class="icons ico1" src="imagens/icon-phone.png" alt="ico-phone">
                <img class="icons ico2" src="imagens/icon-tablet.png" alt="ico-tablet">
                <img class="icons ico3" src="imagens/icon-pc.png" alt="ico-pc">
                <img class="icons ico4" src="imagens/icon-tv.png" alt="ico-tv">
                <img class="icons ico5" src="imagens/icon-print.png" alt="ico-print">
            </div>
            <img class="backprint" src="imagens/back-print.jpg" alt="back-print">
            <div class="after"></div>
        </section>
    </main>
    <footer>
        <div>
            <h3>Desenvolvido por Marcos Grando</h3>
        </div>
    </footer>

    <script>
       function clickMenu() {
            if (itens.style.display == 'block'){
                itens.style.display = 'none'
            } else {
                itens.style.display = 'block'
            }
       } 
    </script>
</body>
</html>
